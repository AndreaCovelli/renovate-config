[settings]
lockfile = true

[tools]
"github:kjanat/actionlint" = "1.17.0"

[tasks."check:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."check:renovate"]
description = "Validate the shared preset and this repository's Renovate config (requires Docker)"
run = '''
set -eu
# renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
RENOVATE_IMAGE=ghcr.io/renovatebot/renovate:44.181.1@sha256:823dc5036b911696c27faacf7664219b28e6e15826405720df29aad208d19f25
docker run --rm -e RENOVATE_TOKEN \
  -v "$PWD:/work:ro" -w /work \
  --entrypoint renovate-config-validator "$RENOVATE_IMAGE" --strict --no-global default.json renovate.json
'''

[tasks.check]
description = "Run all repository checks used in CI"
run = [
  { task = "check:actions" },
  { task = "check:renovate" },
]
